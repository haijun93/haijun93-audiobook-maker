[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "haijun93-audiobook-maker"
version = "1.0.0"
description = "Create Korean audiobooks from text and ebook documents with a local web interface."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "haijun93" }]
keywords = ["audiobook", "korean", "tts", "gemini", "epub"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "beautifulsoup4>=4.12.0,<5",
  "browser-cookie3>=0.20.1,<1",
  "defusedxml>=0.7.1,<1",
  "Flask>=3.1.0,<4",
  "imageio-ffmpeg>=0.6.0,<1",
  "kiwipiepy>=0.20.0,<1",
  "Pillow>=10.0.0,<13",
  "playwright>=1.52.0,<2",
  "PyMuPDF>=1.24.0,<2",
  "python-docx>=1.1.0,<2",
  "waitress>=3.0.0,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<10",
  "ruff>=0.12.0,<1",
]

[project.scripts]
audiobook-maker = "audiobook_maker:main"
audiobook-maker-web = "web_app:main"

[project.urls]
Homepage = "https://github.com/haijun93/haijun93-audiobook-maker"
Issues = "https://github.com/haijun93/haijun93-audiobook-maker/issues"
Source = "https://github.com/haijun93/haijun93-audiobook-maker"

[tool.setuptools]
py-modules = ["audiobook_maker", "web_app"]
packages = ["webui"]

[tool.setuptools.package-data]
webui = ["templates/*.html", "static/*.css", "static/*.js", "static/icons/*.svg"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
  ".cache",
  ".venv",
  ".venv311",
  ".venvs",
  ".work",
  "audiobooks",
  "korean_audiobook_runs",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
